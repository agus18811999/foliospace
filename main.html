function toast(message,type='success'){
  let layer=$('#toasts');if(!layer){layer=document.createElement('div');layer.id='toasts';layer.className='toast-layer';layer.setAttribute('aria-live','polite');document.body.append(layer);}
  const severity=type==='error'?'error':type==='warning'?'warn':type==='info'?'info':'success';
  const title=severity==='success'?'Perubahan berhasil':severity==='warn'?'Perlu diperhatikan':severity==='info'?'Informasi FolioSpace':'Permintaan belum berhasil';
  const el=document.createElement('div');el.className='toast '+severity;el.setAttribute('role',severity==='error'?'alert':'status');el.style.setProperty('--toast-ms','4800ms');
  const icon=document.createElement('div');icon.className='fs-toast-icon';icon.textContent=severity==='success'?'✓':severity==='warn'?'!':severity==='info'?'i':'×';
  const content=document.createElement('div');content.style.flex='1';content.style.minWidth='0';
  const heading=document.createElement('div');heading.className='fs-toast-title';heading.textContent=title;
  const desc=document.createElement('div');desc.className='fs-toast-desc';desc.textContent=String(message||'');content.append(heading,desc);
  const close=document.createElement('button');close.type='button';close.setAttribute('aria-label','Tutup notifikasi');close.textContent='×';close.onclick=()=>{clearTimeout(timeout);el.remove();};
  const progress=document.createElement('i');progress.className='fs-toast-progress';progress.setAttribute('aria-hidden','true');
  el.append(icon,content,close,progress);layer.prepend(el);while(layer.children.length>4)layer.lastElementChild.remove();
  const timeout=setTimeout(()=>el.remove(),4800);
}

/* Analytics UI local state — only visualization switches, no network request. */
const analyticsViewState={days:14,series:'clicks'};
const anNumeric=v=>Math.max(0,Number(v)||0);
function anDays(a){
  const existing=new Map((Array.isArray(a.byDay)?a.byDay:[]).filter(x=>/^\d{4}-\d\d-\d\d$/.test(String(x.date))).map(x=>[x.date,x]));
  const today=new Date();today.setUTCHours(12,0,0,0);
  return Array.from({length:analyticsViewState.days},(_,i)=>{
    const day=new Date(today);day.setUTCDate(today.getUTCDate()-(analyticsViewState.days-1-i));
    const date=day.toISOString().slice(0,10);
    const row=existing.get(date)||{};
    return {date,clicks:anNumeric(row.clicks),views:anNumeric(row.views)};
  });
}
function anMetric(label,value,note,icon,tone){return `<article class="an-metric an-metric--${tone}"><div class="an-metric__top"><span class="an-metric__label">${esc(label)}</span><span class="an-metric__icon">${ic(icon)}</span></div><strong class="an-metric__value">${count(value)}</strong><span class="an-metric__note">${esc(note)}</span></article>`;}

function anChart(a){
 const rows=anDays(a),kind=analyticsViewState.series,values=rows.map(r=>r[kind]);
 const total=values.reduce((s,n)=>s+n,0);
 if(!total)return `<div class="an-chart-blank">${ic('chart')}<strong>Grafik siap menerima aktivitas.</strong><p>Belum ada ${kind==='clicks'?'klik tautan':'kunjungan halaman publik'} yang tercatat dalam ${analyticsViewState.days} hari terakhir.</p></div>`;
 const W=700,H=265,L=40,R=15,T=20,B=36,drawW=W-L-R,drawH=H-T-B,max=Math.max(1,...values),yTop=Math.ceil(max/4)*4;
 const x=i=>L+i*drawW/Math.max(1,values.length-1),y=n=>T+drawH-(n/yTop)*drawH;
 const points=values.map((v,i)=>[x(i),y(v)]),path=points.map(([px,py],i)=>`${i?'L':'M'}${px.toFixed(1)} ${py.toFixed(1)}`).join(' ');
 const area=path+` L ${x(values.length-1).toFixed(1)} ${T+drawH} L ${L} ${T+drawH} Z`;
 const lines=Array.from({length:5},(_,i)=>{const val=yTop-i*yTop/4,py=y(val);return `<line class="an-chart__grid" x1="${L}" y1="${py}" x2="${W-R}" y2="${py}"/><text class="an-chart__axis" text-anchor="end" x="${L-9}" y="${py+3}">${Number.isInteger(val)?count(val):val.toFixed(1)}</text>`;}).join('');
 const labels=rows.map((r,i)=>((i===0||i===rows.length-1||i%Math.max(1,Math.floor(rows.length/6))===0)?`<text class="an-chart__label" x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(r.date.slice(5).replace('-','/'))}</text>`:'')).join('');
 const markers=points.map(([px,py],i)=>`<circle class="an-chart__point" cx="${px}" cy="${py}" r="${values[i]?3.2:1.9}"><title>${esc(rows[i].date)}: ${count(values[i])} ${kind==='clicks'?'klik':'page views'} tercatat</title></circle>`).join('');
 return `<div class="an-chart-scroll"><svg class="an-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren ${kind==='clicks'?'klik tautan':'kunjungan halaman'} ${analyticsViewState.days} hari terakhir, total ${count(total)} event tercatat" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="anAreaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25ba86" stop-opacity=".38"/><stop offset="1" stop-color="#25ba86" stop-opacity=".015"/></linearGradient></defs>${lines}<path class="an-chart__area" d="${area}"/><path class="an-chart__line" d="${path}"/>${markers}${labels}</svg></div>`;
}
function anTopRows(a){

}
function anBreakdown(values,getName,emptyTitle,emptyBody){

}

 const selectedSum=anDays(a).reduce((s,x)=>s+x[analyticsViewState.series],0);

function importPreviewHTML(){
 const items=state.importRows||[],errors=state.importErrors||[],report=state.importReport;
 if(!report)return `<div class="ix-preview__empty"><span class="ix-preview__empty-icon">${ic('eye')}</span><strong>Preview siap saat Anda memilih file.</strong><p>Pilih CSV atau JSON, lalu tekan “Periksa & preview” untuk melihat data yang akan diimpor.</p></div>`;
 const skipped=errors.length,total=report.total||0;
 return `<div class="ix-preview__stats"><div class="ix-preview__stat"><small>Data diperiksa</small><strong>${ixFmt(total)}</strong></div><div class="ix-preview__stat ix-preview__stat--good"><small>Siap diimpor</small><strong>${ixFmt(items.length)}</strong></div><div class="ix-preview__stat ix-preview__stat--warn"><small>Lewati / duplikat</small><strong>${ixFmt(skipped)}</strong></div></div>${items.length?`<div class="ix-preview__table-scroller"><table class="ix-preview__table"><thead><tr><th>No.</th><th>Judul portofolio</th><th>URL</th><th>Status</th><th>Validasi</th></tr></thead><tbody>${items.slice(0,12).map((x,i)=>`<tr><td>${i+1}</td><td title="${esc(x.title)}">${esc(x.title)}</td><td title="${esc(x.url)}">${esc(String(x.url).slice(0,95))}</td><td>${esc(x.status||'draft')}</td><td><span class="ix-preview__status">${ic('check')} Lolos</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="ix-preview__empty"><span class="ix-preview__empty-icon">${ic('info')}</span><strong>Belum ada baris yang layak diimpor.</strong><p>Periksa kolom judul, URL, dan data duplikat dalam file.</p></div>`}${items.length>12?`<div class="ix-preview__footer">Menampilkan 12 dari ${ixFmt(items.length)} baris valid.</div>`:''}${skipped?`<div class="ix-preview__issues"><strong>${ic('info')} ${ixFmt(skipped)} baris dilewati sebelum impor</strong><ul>${errors.slice(0,6).map(err=>`<li>Baris ${ixFmt(err.row)}: ${esc(err.error)}</li>`).join('')}${skipped>6?`<li>Dan ${ixFmt(skipped-6)} masalah lainnya.</li>`:''}</ul></div>`:''}<div class="ix-preview__footer"><span>${ic('check')} ${ixFmt(items.length)} baris siap diproses</span><span>Seluruh data baru disimpan setelah Anda mengonfirmasi impor.</span></div>`;
}
function ixSelectFile(file){
 if(!file)return;state.importFile=file;state.importRows=[];state.importErrors=[];state.importReport=null;
 const f=$('#ixSelectedFile');if(f)f.innerHTML=`<div class="ix-file-selected__icon">${ic('check')}</div><div style="min-width:0;flex:1"><strong title="${esc(file.name)}">${esc(file.name)}</strong><small>${(file.size/1024).toFixed(1)} KB · siap diperiksa</small></div><span class="ix-preview__status">${ic('check')} Dipilih</span>`;
 const btn=$('#ixPreviewButton');if(btn)btn.disabled=false;
 const submit=$('#confirmImport');if(submit){submit.disabled=true;submit.innerHTML=`${ic('upload')} Import 0 karya`};
 const el=$('#importPreview');if(el)el.innerHTML=importPreviewHTML();
 toast('File '+file.name+' dipilih. Tekan Periksa & preview untuk memvalidasi isi.','info');
}

function csvRows(text){const out=[],row=[];let item='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){item+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(item);item='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(item);item='';if(row.some(x=>x!==''))out.push(row.splice(0));else row.splice(0);}else item+=c;}if(q)throw new Error('CSV quotation marks tidak seimbang.');row.push(item);if(row.some(x=>x!==''))out.push(row);if(!out.length)return[];const head=out.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return out.map(cols=>Object.fromEntries(head.map((name,i)=>[name,cols[i]||''])));}

async function previewImport(){
 const file=state.importFile||$('#importFile')?.files?.[0];if(!file)throw new Error('Pilih file CSV atau JSON terlebih dahulu.');
 state.importRows=[];state.importErrors=[];state.importReport=null;
 if(file.size>1024*1024)throw new Error('File terlalu besar. Maksimal 1 MB.');
 const name=file.name.toLowerCase();if(!/\.(csv|json)$/.test(name))throw new Error('Hanya format .csv atau .json yang didukung.');
 const content=await file.text();let input;
 try{if(name.endsWith('.json')){const raw=JSON.parse(content);input=Array.isArray(raw)?raw:raw?.portfolios;}else input=csvRows(content);}catch(e){throw new Error('File tidak dapat dibaca: '+e.message);}
 if(!Array.isArray(input)||!input.length)throw new Error('Tidak ada baris portofolio dalam file.');if(input.length>150)throw new Error('Maksimal 150 baris per batch. Bagi file menjadi beberapa batch.');
 const normUrl=u=>{try{const x=new URL(u);return (x.origin+x.pathname.replace(/\/$/,'')+x.search+x.hash).toLowerCase();}catch{return String(u||'').trim().toLowerCase();}};
 const exists=new Set(ps().map(x=>normUrl(x.url))),seen=new Set(),errors=[],good=[];
 input.forEach((item,i)=>{
   const row=item&&typeof item==='object'?item:{};
   const title=String(row?.title||'').trim(),rawUrl=String(row?.url||'').trim(),url=valid(rawUrl),key=normUrl(url||'');
   let reason='';
   if(title.length<2)reason='Judul minimal 2 karakter';
   else if(title.length>150)reason='Judul lebih dari 150 karakter';
   else if(!url)reason='URL harus menggunakan http/https';
   else if(exists.has(key))reason='URL sudah terdapat dalam portofolio akun';
   else if(seen.has(key))reason='URL duplikat dalam file yang sama';
   else if(row.categoryId&&!cats().some(c=>c.id===row.categoryId))reason='Category ID tidak dikenali akun';

document.addEventListener('dragover',e=>{const dz=e.target.closest?.('.ix-dropzone');if(!dz)return;e.preventDefault();e.dataTransfer.dropEffect='copy';dz.classList.add('is-dragover');});
document.addEventListener('dragleave',e=>{const dz=e.target.closest?.('.ix-dropzone');if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove('is-dragover');});
document.addEventListener('drop',e=>{const dz=e.target.closest?.('.ix-dropzone');if(!dz)return;e.preventDefault();dz.classList.remove('is-dragover');const file=e.dataTransfer?.files?.[0];if(file)ixSelectFile(file);});
document.addEventListener('submit',async e=>{const form=e.target;if(!['portfolioForm','categoryForm','collectionForm','collectionManageForm','profileForm','settingsForm','passwordForm'].includes(form.id))return;e.preventDefault();const btn=$('button[type=submit][form="'+form.id+'"]')||$('button[type=submit]',form);if(form.dataset.fsSubmitting==='true')return;form.dataset.fsSubmitting='true';form.setAttribute('aria-busy','true');const finishButton=busyButton(btn,form.id==='passwordForm'?'Mengubah password…':'Menyimpan…');
 try {if(form.id==='portfolioForm')await savePortfolio(form);if(form.id==='categoryForm')await updateCategory(form);if(form.id==='collectionForm')await updateCollection(form);if(form.id==='collectionManageForm')await updateMembers(form);if(form.id==='profileForm')await saveProfile(form);if(form.id==='settingsForm')await saveSettings(form);if(form.id==='passwordForm')await submitPassword(form);}catch(err){toast(err.message,'error');}finally{form.removeAttribute('aria-busy');delete form.dataset.fsSubmitting;finishButton?.();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalBackdrop')){closeModal();return;}if(e.key==='Tab'&&$('#modalBackdrop')){const el=$$('#modalBackdrop button:not([disabled]),#modalBackdrop input:not([disabled]),#modalBackdrop select:not([disabled]),#modalBackdrop textarea:not([disabled]),#modalBackdrop a[href]');if(!el.length)return;const first=el[0],last=el[el.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if((e.ctrlKey||e.metaKey)&&e.key==='k'&&!state.public){e.preventDefault();$('#globalSearch')?.focus();}});
document.addEventListener('click',async e=>{if(e.target.id==='modalBackdrop'){closeModal();return;}const node=e.target.closest('[data-action]');if(!node)return;const action=node.dataset.action,id=node.dataset.id;
 if(['publicClick'].includes(action)){if(valid(node.getAttribute('href'))){timedApi('analytics.track',{slug:state.public.profile.slug,type:'external_click',portfolioId:id,visitor:visitorId()},{anonymous:true}).catch(()=>{});}return;}
 e.preventDefault();if(node.dataset.fsBusy==='1')return;
 const finishAction=MUTATION_ACTIONS.has(action)?busyButton(node,MUTATION_ACTION_LABELS[action]||'Memproses…'):null;
 try{
 switch(action){case 'nav':navTo(node.dataset.route);break;case 'collapse':document.body.classList.toggle('collapsed');break;case 'toggleSidebar':state.sidebarOpen=!state.sidebarOpen;renderShellState();break;case 'closeModal':closeModal();break;case 'movePickUp':{const row=node.closest('.pick-row');if(row?.previousElementSibling)row.parentElement.insertBefore(row,row.previousElementSibling);break;}case 'movePickDown':{const row=node.closest('.pick-row');if(row?.nextElementSibling)row.parentElement.insertBefore(row.nextElementSibling,row);break;}
 case 'addPortfolio':portfolioForm(null);break;case 'editPortfolio':portfolioForm(ps().find(x=>x.id===id));break;case 'duplicatePortfolio':{const p=ps().find(x=>x.id===id);const copy=await timedApi('portfolio.create',{...p,title:p.title+' (copy)',status:'draft'});state.data.portfolios.unshift(copy);sync();renderRoute();toast('Portfolio duplicated.');break;}
 case 'promotePortfolio':{const ordered=[...ps()].sort((a,b)=>Number(a.displayOrder)-Number(b.displayOrder));const ids=[id,...ordered.filter(x=>x.id!==id).map(x=>x.id)];await timedApi('portfolio.reorder',{ids});ids.forEach((pid,i)=>{const p=ps().find(x=>x.id===pid);if(p)p.displayOrder=i;});state.filter.sort='custom';sync();renderRoute();toast('Portfolio moved to top.');break;}case 'toggleFeature':{const p=ps().find(x=>x.id===id);const old=p.featured;p.featured=!old;renderRoute();try{const changed=await timedApi('portfolio.update',{...p,featured:p.featured});Object.assign(p,changed);sync();toast('Featured setting saved.');}catch(ex){p.featured=old;renderRoute();throw ex;}break;}
 case 'archivePortfolio':{const p=ps().find(x=>x.id===id);await bulk(p.status==='archived'?'restore':'archive',[id]);break;}
 case 'deletePortfolio':confirmAction('Delete portfolio?','This permanently removes the portfolio link.',async()=>bulk('delete',[id]));break;
 case 'gridView':state.view='grid';renderPortfolios();break;case 'listView':state.view='list';renderPortfolios();break;
 case 'resetFilters':state.filter={category:'all',status:'all',sort:'newest',q:''};state.selected.clear();renderPortfolios();break;case 'clearSelect':state.selected.clear();renderPortfolioResults();break;
 case 'bulkPublish':await bulk('publish');break;case 'bulkArchive':await bulk('archive');break;case 'bulkFeature':await bulk('feature');break;case 'bulkDelete':confirmAction('Delete selected portfolios?','This cannot be undone.',async()=>bulk('delete'));break;
 case 'ctResetSearch':{categoryQuery='';const field=$('#ctSearch');if(field)field.value='';renderCategoryResults();field?.focus();break;}case 'categoryViewPortfolios':{state.filter.category=id;state.filter.q='';navTo('portfolio');break;}case 'addCategory':categoryForm(null);break;case 'editCategory':categoryForm(cats().find(x=>x.id===id));break;case 'deleteCategory':confirmAction('Delete category?','Portfolio links stay intact; their category is cleared.',async()=>{await timedApi('category.delete',{id});state.data.categories=cats().filter(x=>x.id!==id);ps().filter(x=>x.categoryId===id).forEach(x=>x.categoryId='');sync();renderRoute();toast('Category deleted.');});break;
 case 'cxScope':{collectionScope=id;renderCollectionResults();break;}case 'cxReset':{collectionQuery='';collectionScope='all';const input=$('#cxSearch');if(input)input.value='';renderCollectionResults();input?.focus();break;}case 'addCollection':collectionForm(null);break;case 'editCollection':collectionForm(cols().find(x=>x.id===id));break;case 'manageCollection':collectionManage(cols().find(x=>x.id===id));break;case 'deleteCollection':confirmAction('Delete collection?','The original portfolio links are preserved.',async()=>{await timedApi('collection.delete',{id});state.data.collections=cols().filter(x=>x.id!==id);state.data.collectionItems=data().collectionItems.filter(x=>x.collectionId!==id);sync();renderRoute();toast('Collection deleted.');});break;
 case 'confirmAction':{node.disabled=true;await state.confirmAction?.();state.confirmAction=null;closeModal();break;}
 case 'share':{if(!data())break;if(!data().profile.isPublic){toast('Profil masih private. Aktifkan Public Profile di Settings.','warning');navTo('settings');break;}const link=urlPublic();if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(link);toast('Public portfolio URL copied!');}else modal({title:'Public Portfolio URL',body:`<div class="modal-body"><input class="control" readonly value="${esc(link)}"></div>`,footer:`<a class="btn btn-primary" target="_blank" rel="noopener noreferrer" href="${esc(link)}">Open page</a><button class="btn" data-action="closeModal">Close</button>`});break;}
 case 'shareCollection':{const c=cols().find(x=>x.id===id);if(!c)throw new Error('Koleksi tidak ditemukan.');if(c.visibility==='private')throw new Error('Koleksi privat tidak dapat dibagikan.');if(!data().profile?.isPublic){toast('Aktifkan halaman publik di Settings sebelum membagikan koleksi.','warning');navTo('settings');break;}const link=urlPublic()+'&collection='+encodeURIComponent(id);if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(link);toast('Collection URL copied.');}else modal({title:'Collection URL',body:`<div class="modal-body"><input class="control" readonly value="${esc(link)}"></div>`});break;}case 'publicFilter':state.publicFilter=id;renderPublicGallery();break;case 'publicDetail':publicDetails(id);break;
 case 'anDays':{const days=Number(id);if([7,14,30].includes(days)){analyticsViewState.days=days;renderRoute();}break;}case 'anSeries':{if(['clicks','views'].includes(id)){analyticsViewState.series=id;renderRoute();}break;}
 case 'refresh':await refresh();toast('Data synchronized.');break;
 case 'chooseImportFile':$('#importFile')?.click();break;case 'previewImport':await previewImport();if(state.importRows.length&&!state.importErrors.length)toast('Validasi selesai. Data siap untuk diimpor.','success');break;case 'confirmImport':{const rows=state.importRows;if(!rows.length)throw new Error('Preview data sebelum import.');node.disabled=true;const r=await timedApi('portfolio.import',{items:rows},{timeout:120000});state.importRows=[];state.importFile=null;state.importErrors=[];state.importReport=null;await refresh();toast(`${r.imported} portfolios imported. ${r.errors.length} rows skipped.`,r.errors.length?'warning':'success');if(r.errors.length)modal({title:'Import report',body:`<div class="modal-body"><p>${r.errors.length} skipped:</p><div class="list-items">${r.errors.slice(0,20).map(x=>`<div class="activity-row"><strong>Row ${x.row}</strong> — ${esc(x.error)}</div>`).join('')}</div></div>`});break;}
 case 'exportJson':exportData('json');toast('Backup JSON berhasil disiapkan untuk diunduh.');break;case 'exportCsv':exportData('csv');toast('File CSV berhasil disiapkan untuk diunduh.');break;
 case 'logout':{try{await timedApi('auth.logout');}catch(ex){toast('Logout lokal; server belum mengonfirmasi pencabutan sesi.','warning');}FS.cache.clearAll();FS.session.clear();location.replace('index.html');break;}
 case 'logoutAll':confirmAction('Sign out all sessions?','All devices will need to log in again.',async()=>{await timedApi('auth.logoutAll');FS.cache.clearAll();FS.session.clear();location.replace('index.html');});break;
 case 'deleteAccount':modal({title:'Permanently delete your account',subtitle:'All portfolios and associated data will be deleted.',body:`<form id="accountDeleteForm"><div class="modal-body"><div class="notice error">This action is irreversible. Type DELETE to confirm.</div><div class="field mt16"><label>Confirmation</label><input name="confirm" required pattern="DELETE" placeholder="DELETE"></div></div></form>`,footer:`<button class="btn" data-action="closeModal">Cancel</button><button class="btn btn-danger" type="submit" form="accountDeleteForm">Delete account permanently</button>`});break;
 default:break;
 }
 }catch(err){toast(err.message,'error');}
 finally{finishAction?.();}
});

start();
})();
