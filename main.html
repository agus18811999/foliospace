function overview(){const p=ps(),a=data().analytics||{},recent=[...p].sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))).slice(0,3),feature=p.filter(x=>x.featured&&x.status==='published').slice(0,3),name=esc(data().user.name.split(/\s+/)[0]);return `<section class="hero"><div><span class="eyebrow">YOUR DIGITAL WORKSPACE · FOLIOSPACE</span><h1>Welcome back, <span>${name}.</span></h1><p>Satu tempat untuk mengorganisasi seluruh karya terbaikmu, membangun personal branding, dan membuat kesan profesional yang tak terlupakan.</p><div class="button-row"><button class="btn btn-primary" data-action="addPortfolio">${ic('add')} Add Portfolio</button><button class="btn" data-action="share">${ic('share')} View public page</button></div></div><div class="hero-art"><div class="hero-window"><span></span><span></span><span></span></div></div></section><section class="stats">${metric('Total portfolios',p.length,'portfolio','All your digital work')}${metric('Published',p.filter(x=>x.status==='published').length,'globe','Visible to your audience')}${metric('Categories',cats().length,'folder','Organized by expertise')}${metric('Link clicks',a.linkClicks||0,'chart','Recorded public visits')}</section><div class="grid2">${panel('Featured work',feature.length?`<div class="list-items">${feature.map(x=>activity(x)).join('')}</div>`:empty('Belum ada featured work','Tandai karya terbaik Anda sebagai Featured untuk menampilkannya di sini.'),`<button class="btn btn-sm" data-action="nav" data-route="portfolio">All works →</button>`)}${panel('Recently added',recent.length?`<div class="list-items">${recent.map(x=>activity(x)).join('')}</div>`:empty('Belum ada karya','Tambahkan link pertama untuk mulai membangun portofolio profesional.','addPortfolio'),`<button class="btn btn-sm" data-action="nav" data-route="portfolio">View all →</button>`)}</div><div class="section-title mt16"><div><h2>Quick actions</h2><p>Langkah cepat untuk mengelola ruang portofolio Anda.</p></div></div><div class="grid3"><button class="quick-tile" data-action="addPortfolio">${ic('add')} Add new work</button><button class="quick-tile" data-action="addCategory">${ic('folder')} Create category</button><button class="quick-tile" data-action="addCollection">${ic('layers')} Create collection</button></div>`;}
function activity(p){return `<div class="activity-row"><span class="activity-dot"></span><div class="grow" style="min-width:0"><strong class="truncate">${esc(p.title)}</strong><small>${esc(catName(p.categoryId))} · ${fmt(p.updatedAt)}</small></div><button class="btn btn-sm" data-action="editPortfolio" data-id="${esc(p.id)}">Edit</button></div>`;}
function sortedPortfolios(){const q=state.filter.q.toLowerCase().trim();let list=ps().filter(p=>(state.filter.category==='all'||p.categoryId===state.filter.category)&&(state.filter.status==='all'||p.status===state.filter.status)&&(!q||[p.title,p.description,p.platform,p.type,catName(p.categoryId),...(p.tags||[]),...cols().filter(c=>data().collectionItems.some(x=>x.portfolioId===p.id&&x.collectionId===c.id)).map(c=>c.name)].join(' ').toLowerCase().includes(q)));
 const sort=state.filter.sort;if(sort==='custom')list.sort((a,b)=>Number(a.displayOrder)-Number(b.displayOrder));else if(sort==='az')list.sort((a,b)=>a.title.localeCompare(b.title));else if(sort==='clicked')list.sort((a,b)=>(data().analytics.perPortfolio?.[b.id]?.clicks||0)-(data().analytics.perPortfolio?.[a.id]?.clicks||0));else list.sort((a,b)=>String(sort==='oldest'?a.createdAt:b.createdAt).localeCompare(String(sort==='oldest'?b.createdAt:a.createdAt)));return list;}
function portfolioToolbar(){return `<div class="section-title"><div><h2>My Portfolio</h2><p>Manage, curate, and showcase your digital work.</p></div><button class="btn btn-primary" data-action="addPortfolio">${ic('add')} New Portfolio</button></div><div class="toolbar"><div class="toolbar-group"><select id="categoryFilter" class="control" aria-label="Category filter"><option value="all">All categories</option>${cats().map(c=>`<option value="${esc(c.id)}" ${state.filter.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="statusFilter" class="control" aria-label="Status filter">${[['all','All statuses'],['published','Published'],['draft','Draft'],['archived','Archived']].map(([v,l])=>`<option value="${v}" ${state.filter.status===v?'selected':''}>${l}</option>`).join('')}</select><select id="sortFilter" class="control" aria-label="Sort by">${[['newest','Newest first'],['oldest','Oldest first'],['az','Alphabetical'],['clicked','Most clicked'],['custom','Custom order']].map(([v,l])=>`<option value="${v}" ${state.filter.sort===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn btn-sm" data-action="resetFilters">Reset</button></div><div class="toolbar-group"><span id="resultCount" style="font-size:12px;color:var(--muted)"></span><div class="segmented"><button data-action="gridView" class="${state.view==='grid'?'active':''}">Grid</button><button data-action="listView" class="${state.view==='list'?'active':''}">List</button></div></div></div><div id="bulkActions" class="button-row" style="margin-bottom:12px"></div><div id="portfolioResults"></div>`;}
function renderPortfolios(){const page=$('#pageContent');page.innerHTML=portfolioToolbar();$('#globalSearch').value=state.filter.q;renderPortfolioResults();}
function renderPortfolioResults(){const host=$('#portfolioResults');if(!host)return;const list=sortedPortfolios();$('#resultCount').textContent=`${list.length} portfolio${list.length===1?'':'s'}`;
 let html='';if(!list.length)html=empty(ps().length?'Tidak ada hasil':'Mulai dengan karya pertamamu',ps().length?'Coba ubah kata kunci atau filter pencarian.':'Tautkan website, Google Sheets, Figma, GitHub, atau karya profesional lainnya.',ps().length?'':'addPortfolio');
 else if(state.view==='grid')html=`<div class="portfolio-grid">${list.map(x=>card(x)).join('')}</div>`;
 else html=`<div class="table-wrap"><table class="data-table"><thead><tr><th><input type="checkbox" id="selectAll" ${list.length&&list.every(p=>state.selected.has(p.id))?'checked':''} aria-label="Select all"></th><th>Portfolio</th><th>Category</th><th>Status</th><th>Modified</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td><input type="checkbox" data-select="${esc(p.id)}" ${state.selected.has(p.id)?'checked':''}></td><td><div class="table-title"><span class="table-thumb">${valid(p.thumbnail)?`<img src="${esc(valid(p.thumbnail))}" alt="" loading="lazy" onerror="this.remove()">`:'✦'}</span><span class="truncate" style="max-width:210px">${esc(p.title)}</span></div></td><td>${esc(catName(p.categoryId))}</td><td>${pill(p.status)}</td><td>${fmt(p.updatedAt)}</td><td><div class="button-row"><button class="btn btn-sm" data-action="editPortfolio" data-id="${esc(p.id)}">Edit</button><button class="btn btn-sm" data-action="archivePortfolio" data-id="${esc(p.id)}">${p.status==='archived'?'Restore':'Archive'}</button></div></td></tr>`).join('')}</tbody></table></div>`;
 host.innerHTML=html;const countSel=state.selected.size;$('#bulkActions').innerHTML=countSel?`<span class="pill">${countSel} selected</span><button class="btn btn-sm" data-action="bulkPublish">Publish</button><button class="btn btn-sm" data-action="bulkArchive">Archive</button><button class="btn btn-sm" data-action="bulkFeature">Feature</button><button class="btn btn-sm btn-danger" data-action="bulkDelete">Delete</button><button class="btn btn-sm" data-action="clearSelect">Clear</button>`:'';
}
function categoriesPage(){return `<div class="section-title"><div><h2>Portfolio Categories</h2><p>Organisasikan karya berdasarkan keterampilan dan bidang profesional.</p></div><button class="btn btn-primary" data-action="addCategory">${ic('add')} Add Category</button></div>${cats().length?`<div class="grid3">${cats().map(c=>`<article class="surface category-card"><div class="category-top"><div class="category-ico" style="background:${esc(c.color)}20;color:${esc(c.color)}">${ic('folder')}</div><button class="btn btn-sm" data-action="editCategory" data-id="${esc(c.id)}">${ic('edit')} Edit</button></div><div><h3>${esc(c.name)}</h3><p>${ps().filter(p=>p.categoryId===c.id).length} linked portfolios</p></div><button style="align-self:start" class="btn btn-sm btn-danger" data-action="deleteCategory" data-id="${esc(c.id)}">Remove category</button></article>`).join('')}</div>`:panel('No categories yet',empty('Beri struktur pada karyamu','Buat kategori seperti Business Analysis, UI/UX, atau Development.','addCategory','Create category'))}`;}
function collectionsPage(){return `<div class="section-title"><div><h2>Collections</h2><p>Susun beberapa karya menjadi kelompok profesional yang dapat dibagikan.</p></div><button class="btn btn-primary" data-action="addCollection">${ic('add')} New Collection</button></div>${cols().length?`<div class="grid3">${cols().map(c=>{const items=data().collectionItems.filter(x=>x.collectionId===c.id);return `<article class="surface collection-card"><div class="category-top"><div class="category-ico">${ic('layers')}</div><span class="pill ${c.visibility==='private'?'draft':''}">${c.visibility==='private'?'Private':'Public'}</span></div><div><h3>${esc(c.name)}</h3><p>${esc(c.description||'Curated selection of works')}</p></div><small>${items.length} works in this collection</small><div class="button-row"><button class="btn btn-sm btn-primary" data-action="manageCollection" data-id="${esc(c.id)}">${ic('portfolio')} Manage works</button><button class="btn btn-sm" data-action="shareCollection" data-id="${esc(c.id)}">Share</button><button class="btn btn-sm" data-action="editCollection" data-id="${esc(c.id)}">Edit</button><button class="btn btn-sm btn-danger" data-action="deleteCollection" data-id="${esc(c.id)}">Delete</button></div></article>`;}).join('')}</div>`:panel('Organize with collections',empty('Belum ada collections','Buat koleksi tematik, misalnya Business Analyst Portfolio atau Web Development.','addCollection','Create collection'))}`;}
function analyticsPage(){const a=data().analytics||{},list=Object.entries(a.perPortfolio||{}).map(([id,s])=>({...s,p:ps().find(x=>x.id===id)})).filter(x=>x.p).sort((x,y)=>y.clicks-x.clicks).slice(0,8),days=a.byDay||[],max=Math.max(1,...days.map(x=>x.clicks));const chart=days.length?`<div class="analytics-bars">${days.map((x,i)=>`<div class="bar-wrap" title="${esc(x.date)}: ${x.clicks} clicks"><div class="bar" style="height:${Math.max(2,x.clicks/max*95)}%"></div>${i===0||i===days.length-1||i%Math.max(1,Math.floor(days.length/5))===0?`<small>${esc(x.date.slice(5))}</small>`:''}</div>`).join('')}</div>`:empty('Belum ada traffic nyata','Page views dan link clicks akan tercatat setelah profil publik dikunjungi.');return `<div class="section-title"><div><h2>Portfolio Analytics</h2><p>Angka berasal dari aktivitas pengunjung yang benar-benar tercatat (bukan estimasi).</p></div><button class="btn" data-action="refresh">${ic('refresh')} Refresh data</button></div><div class="stats">${metric('Public page views',a.pageViews,'eye','Observed visits')}${metric('Portfolio detail views',a.detailViews,'portfolio','Details opened')}${metric('External link clicks',a.linkClicks,'external','Links opened')}${metric('Tracked events',a.totalEvents,'chart','Deduplicated events')}</div><div class="grid2">${panel('External link clicks over time',chart)}${panel('Most clicked work',list.length?`<div class="list-items">${list.map(({p,clicks,views})=>`<div class="activity-row"><div class="grow" style="min-width:0"><strong class="truncate">${esc(p.title)}</strong><small>${count(views)} detail views</small></div><strong>${count(clicks)} clicks</strong></div>`).join('')}</div>`:empty('Belum ada klik','Tautan karya populer akan muncul saat dikunjungi.'))}</div><div class="grid2 mt16">${panel('Performance by category',Object.keys(a.byCategory||{}).length?`<div class="list-items">${Object.entries(a.byCategory).sort((x,y)=>y[1].clicks-x[1].clicks).map(([id,v])=>`<div class="activity-row"><div class="grow"><strong>${esc(id==='uncategorized'?'Uncategorized':catName(id))}</strong><small>${count(v.views)} detail views</small></div><strong>${count(v.clicks)} clicks</strong></div>`).join('')}</div>`:empty('No categories','Category engagement will appear when recorded.'))}${panel('Performance by collection',Object.keys(a.byCollection||{}).length?`<div class="list-items">${Object.entries(a.byCollection).sort((x,y)=>y[1].clicks-x[1].clicks).map(([id,v])=>`<div class="activity-row"><div class="grow"><strong>${esc(cols().find(x=>x.id===id)?.name||'Collection')}</strong><small>${count(v.views)} detail views</small></div><strong>${count(v.clicks)} clicks</strong></div>`).join('')}</div>`:empty('No collection engagement','Assign portfolios to collections to group engagement.'))}</div><p class="empty-banner">Analytics adalah penghitung event best-effort, bukan unique visitors yang diverifikasi. Pemblokir skrip, kondisi offline, bot, dan deduplikasi dapat memengaruhi angka.</p>`;}
function importPage(){return `<div class="section-title"><div><h2>Import & Export</h2><p>Cadangkan atau pindahkan koleksi portofolio Anda dengan mudah.</p></div></div><div class="grid2">${panel('Import portfolios',`<p class="muted" style="font-size:12px">Impor CSV atau JSON maksimal 1 MB / 150 baris per batch, dengan pratinjau dan pemeriksaan duplikat URL.</p><input id="importFile" type="file" accept=".csv,.json,text/csv,application/json" class="control" style="margin:6px 0 14px"><div class="button-row"><button class="btn btn-soft" data-action="previewImport">${ic('eye')} Preview file</button><button class="btn btn-primary" id="confirmImport" data-action="confirmImport" ${state.importRows.length?'':'disabled'}>Import ${state.importRows.length} items</button></div><div id="importPreview" style="margin-top:17px">${importPreviewHTML()}</div>`)}${panel('Export & backup',`<p class="muted" style="font-size:12px">Unduh semua portofolio milik akun ini. Data akun lain tidak pernah disertakan.</p><div class="button-row"><button class="btn" data-action="exportJson">${ic('download')} Export JSON</button><button class="btn" data-action="exportCsv">${ic('download')} Export CSV</button></div><div class="notice mt16">${count(ps().length)} portfolios siap diekspor. Simpan file backup di lokasi aman.</div>` )}</div>`;}
function importPreviewHTML(){const items=state.importRows;return items.length?`<span class="pill">${items.length} rows parsed</span><div class="import-preview"><table><thead><tr><th>Title</th><th>URL</th><th>Status</th></tr></thead><tbody>${items.slice(0,15).map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(String(x.url).slice(0,65))}</td><td>${esc(x.status||'draft')}</td></tr>`).join('')}</tbody></table></div>${items.length>15?'<small>Showing first 15 items</small>':''}`:empty('No file preview','Pilih file CSV atau JSON untuk melihat data sebelum import.');}
function settingsPage(){const u=data().user,p=data().profile,s=data().settings;return `<div class="section-title"><div><h2>Settings & Presentation</h2><p>Atur identitas profesional, tampilan publik, dan keamanan akun Anda.</p></div></div><section class="surface form-section"><h3>Public Portfolio Profile</h3><p>Profil yang Anda bagikan ke recruiter, perusahaan, atau klien.</p><form id="profileForm"><div class="form-grid"><div class="field"><label>Public username</label><input name="slug" value="${esc(p.slug||'')}" required minlength="3" maxlength="55" pattern="[a-z0-9-]+"></div><div class="field"><label>Professional headline</label><input name="headline" value="${esc(p.headline||'')}" maxlength="140" placeholder="Business Analyst · Product & Strategy"></div><div class="field span2"><label>About me / Bio</label><textarea name="bio" maxlength="1600" placeholder="Write your professional introduction">${esc(p.bio||'')}</textarea></div><div class="field"><label>Location (optional)</label><input name="location" value="${esc(p.location||'')}" maxlength="80"></div><div class="field"><label>Profile picture URL (https)</label><input name="avatar" type="url" value="${esc(p.avatar||'')}" placeholder="https://…"></div><div class="field"><label>Public contact email</label><input name="contactEmail" type="email" value="${esc(p.contactEmail||'')}" placeholder="hello@example.com"></div><div class="field"><label>Social links (one per line: Label | https://url)</label><textarea name="socialLinks" rows="3" placeholder="LinkedIn | https://linkedin.com/in/…">${esc((p.socialLinks||[]).map(x=>x.label+' | '+x.url).join('\n'))}</textarea></div><div class="field"><label>Card layout</label><select name="layout"><option value="grid" ${p.layout==='grid'?'selected':''}>Grid view</option><option value="list" ${p.layout==='list'?'selected':''}>List view</option></select></div><div class="field"><label>Grid columns</label><select name="gridColumns">${[2,3,4].map(n=>`<option value="${n}" ${Number(p.gridColumns||3)===n?'selected':''}>${n} columns</option>`).join('')}</select></div><div class="field"><label>Profile header style</label><select name="headerStyle"><option value="soft" ${p.headerStyle!=='minimal'?'selected':''}>Soft gradient</option><option value="minimal" ${p.headerStyle==='minimal'?'selected':''}>Minimal white</option></select></div><div class="field"><label>Accent color (green palette)</label><select name="accent">${[['#16865D','Emerald'],['#42B883','Mint green'],['#2C9766','Sage green']].map(([v,l])=>`<option value="${v}" ${p.accent===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="button-row flex-wrap"><label class="field-check"><input type="checkbox" name="isPublic" ${p.isPublic?'checked':''}> Public profile enabled</label><label class="field-check"><input type="checkbox" name="showDescriptions" ${p.showDescriptions?'checked':''}> Show descriptions</label><label class="field-check"><input type="checkbox" name="showCategories" ${p.showCategories?'checked':''}> Show categories</label><label class="field-check"><input type="checkbox" name="showCollections" ${p.showCollections?'checked':''}> Show collections</label></div><div class="preview-profile" id="liveProfilePreview"><span class="eyebrow">LIVE LOCAL PREVIEW</span><h3 id="previewName">${esc(u.name)}</h3><div id="previewHeadline">${esc(p.headline||'Your professional headline')}</div><small id="previewBio">${esc(p.bio||'Your introduction will appear here.')}</small></div><div class="button-row mt16"><button class="btn btn-primary" type="submit">${ic('check')} Save public profile</button><button class="btn" type="button" data-action="share">${ic('external')} Preview public URL</button></div></form></section>
<section class="surface form-section"><h3>Account Preferences</h3><p>Preferensi tampilan workspace, sorting, dan animasi.</p><form id="settingsForm"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" value="${esc(u.name)}" required minlength="2"></div><div class="field"><label>Account email</label><input value="${esc(u.email)}" disabled></div><div class="field"><label>Default portfolio layout</label><select name="layout"><option value="grid" ${s.layout==='grid'?'selected':''}>Grid</option><option value="list" ${s.layout==='list'?'selected':''}>List</option></select></div><div class="field"><label>Default sorting</label><select name="sort">${[['newest','Newest'],['oldest','Oldest'],['az','Alphabetical'],['clicked','Most clicked'],['custom','Custom order']].map(([v,l])=>`<option value="${v}" ${s.sort===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Date format</label><select name="dateFormat"><option value="id-ID" ${s.dateFormat==='id-ID'?'selected':''}>Indonesia</option><option value="en-US" ${s.dateFormat==='en-US'?'selected':''}>US</option></select></div><div class="field"><label>Motion preferences</label><select name="motion"><option value="auto" ${s.motion==='auto'?'selected':''}>System default</option><option value="reduce" ${s.motion==='reduce'?'selected':''}>Reduced motion</option></select></div></div><button class="btn btn-primary" type="submit">Save preferences</button></form></section>
<section class="surface form-section"><h3>Security & Account</h3><p>Ubah password dan kelola sesi aktif Anda.</p><form id="passwordForm"><div class="form-grid"><div class="field"><label>Current password</label><input name="oldPassword" type="password" autocomplete="current-password" required></div><div class="field"><label>New password</label><input name="password" type="password" autocomplete="new-password" required minlength="10" placeholder="10+ characters incl. letters & numbers"></div></div><div class="button-row"><button class="btn" type="submit">Change password</button><button class="btn" type="button" data-action="logoutAll">${ic('logout')} Sign out all sessions</button><button class="btn btn-danger" type="button" data-action="deleteAccount">${ic('trash')} Delete account</button></div></form></section>`;}
function renderRoute(){if(!data())return;const page=$('#pageContent');if(!page)return;renderShellState();if(state.route==='portfolio')return renderPortfolios();page.innerHTML=({overview,categories:categoriesPage,collections:collectionsPage,analytics:analyticsPage,import:importPage,settings:settingsPage})[state.route]?.()||overview();}
function modal({title,subtitle='',body,footer='',width=''}){const layer=$('#modalLayer');if(!layer)return;document.body.style.overflow='hidden';layer.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" style="${width?'max-width:'+width+'px':''}"><div class="modal-head"><div><h2 id="modalTitle">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button class="modal-close" data-action="closeModal" aria-label="Close">${ic('close')}</button></div>${body}<div class="modal-actions">${footer||`<button class="btn" data-action="closeModal">Close</button>`}</div></section></div>`;const first=$('input:not([type=hidden]),select,textarea,button',$('#modalBackdrop'));first?.focus({preventScroll:true});}
function closeModal(){const layer=$('#modalLayer');if(layer)layer.replaceChildren();document.body.style.overflow='';}
const field=(label,name,value='',type='text',extra='')=>`<div class="field"><label for="f-${esc(name)}">${esc(label)}</label><input id="f-${esc(name)}" name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></div>`;
function portfolioForm(p){const edit=!!p;const title=edit?'Edit portfolio':'Add new portfolio';const body=`<form id="portfolioForm" data-id="${edit?esc(p.id):''}"><div class="modal-body"><div class="form-grid">${field('Portfolio title *','title',p?.title||'','text','required minlength="2" maxlength="150"')}${field('Original URL *','url',p?.url||'','url','required placeholder="https://…"')}
<div class="field span2"><label>Description</label><textarea name="description" maxlength="1600" placeholder="What did you build, what problem did it solve?">${esc(p?.description||'')}</textarea></div><div class="field"><label>Category</label><select name="categoryId"><option value="">No category</option>${cats().map(c=>`<option value="${esc(c.id)}" ${p?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${[['draft','Draft'],['published','Published'],['archived','Archived']].map(([v,l])=>`<option value="${v}" ${(p?.status||'draft')===v?'selected':''}>${l}</option>`).join('')}</select></div>
${field('Platform (Figma, GitHub, etc.)','platform',p?.platform||'','text','maxlength="65"')}${field('Portfolio type','type',p?.type||'','text','maxlength="65"')}

function csvRows(text){const out=[],row=[];let item='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){item+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(item);item='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(item);item='';if(row.some(x=>x!==''))out.push(row.splice(0));else row.splice(0);}else item+=c;}if(q)throw new Error('CSV quotation marks tidak seimbang.');row.push(item);if(row.some(x=>x!==''))out.push(row);if(!out.length)return[];const head=out.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return out.map(cols=>Object.fromEntries(head.map((name,i)=>[name,cols[i]||''])));}

 case 'addCollection':collectionForm(null);break;case 'editCollection':collectionForm(cols().find(x=>x.id===id));break;case 'manageCollection':collectionManage(cols().find(x=>x.id===id));break;case 'deleteCollection':confirmAction('Delete collection?','The original portfolio links are preserved.',async()=>{await FS.api('collection.delete',{id});state.data.collections=cols().filter(x=>x.id!==id);state.data.collectionItems=data().collectionItems.filter(x=>x.collectionId!==id);sync();renderRoute();toast('Collection deleted.');});break;

 case 'share':{if(!data())break;if(!data().profile.isPublic){toast('Profil masih private. Aktifkan Public Profile di Settings.','warning');navTo('settings');break;}const link=urlPublic();if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(link);toast('Public portfolio URL copied!');}else modal({title:'Public Portfolio URL',body:`<div class="modal-body"><input class="control" readonly value="${esc(link)}"></div>`,footer:`<a class="btn btn-primary" target="_blank" rel="noopener noreferrer" href="${esc(link)}">Open page</a><button class="btn" data-action="closeModal">Close</button>`});break;}
 case 'shareCollection':{const c=cols().find(x=>x.id===id);if(c.visibility==='private')throw new Error('Collection privat tidak dapat dibagikan.');const link=urlPublic()+'&collection='+encodeURIComponent(id);if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(link);toast('Collection URL copied.');}else modal({title:'Collection URL',body:`<div class="modal-body"><input class="control" readonly value="${esc(link)}"></div>`});break;}case 'publicFilter':state.publicFilter=id;renderPublicGallery();break;case 'publicDetail':publicDetails(id);break;
 case 'refresh':await refresh();toast('Data synchronized.');break;
 case 'previewImport':await previewImport();break;case 'confirmImport':{const rows=state.importRows;if(!rows.length)throw new Error('Preview data sebelum import.');node.disabled=true;const r=await FS.api('portfolio.import',{items:rows},{timeout:120000});state.importRows=[];await refresh();toast(`${r.imported} portfolios imported. ${r.errors.length} rows skipped.`,r.errors.length?'warning':'success');if(r.errors.length)modal({title:'Import report',body:`<div class="modal-body"><p>${r.errors.length} skipped:</p><div class="list-items">${r.errors.slice(0,20).map(x=>`<div class="activity-row"><strong>Row ${x.row}</strong> — ${esc(x.error)}</div>`).join('')}</div></div>`});break;}
 case 'exportJson':exportData('json');break;case 'exportCsv':exportData('csv');break;
 case 'logout':{try{await FS.api('auth.logout');}catch(ex){toast('Logout lokal; server belum mengonfirmasi pencabutan sesi.','warning');}FS.cache.clearAll();FS.session.clear();location.replace('index.html');break;}
 case 'logoutAll':confirmAction('Sign out all sessions?','All devices will need to log in again.',async()=>{await FS.api('auth.logoutAll');FS.cache.clearAll();FS.session.clear();location.replace('index.html');});break;
 case 'deleteAccount':modal({title:'Permanently delete your account',subtitle:'All portfolios and associated data will be deleted.',body:`<form id="accountDeleteForm"><div class="modal-body"><div class="notice error">This action is irreversible. Type DELETE to confirm.</div><div class="field mt16"><label>Confirmation</label><input name="confirm" required pattern="DELETE" placeholder="DELETE"></div></div></form>`,footer:`<button class="btn" data-action="closeModal">Cancel</button><button class="btn btn-danger" type="submit" form="accountDeleteForm">Delete account permanently</button>`});break;
 default:break;
 }
 }catch(err){toast(err.message,'error');if(node.isConnected)node.disabled=false;}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='accountDeleteForm')return;e.preventDefault();const confirm=new FormData(e.target).get('confirm');if(confirm!=='DELETE')return toast('Type DELETE exactly.','error');const button=$('button[form="accountDeleteForm"]');button.disabled=true;try{await FS.api('auth.deleteAccount',{confirm});FS.cache.clearAll();FS.session.clear();location.replace('index.html');}catch(err){toast(err.message,'error');button.disabled=false;}});
start();
})();
